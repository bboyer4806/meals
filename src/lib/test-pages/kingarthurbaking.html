            "recipeInstructions": "\u003Cp\u003EPreheat the oven to 325°F. Lightly grease (or line with parchment) two baking sheets.\u003C/p\u003E\n, \u003Cp\u003EWeigh your flour; or measure it by gently spooning it into a cup, then sweeping off any excess.\u003C/p\u003E\n, \u003Cp\u003EIn a medium bowl, whisk together the flour, baking soda, salt, and spices. Set aside.\u003C/p\u003E\n, \u003Cp\u003EIn a large mixing bowl, using either a hand whisk, an electric mixer, or a stand mixer, whisk the sugar and oil until combined.\u003C/p\u003E\n, \u003Cp\u003EAdd the egg and whisk until smooth.\u003C/p\u003E\n, \u003Cp\u003EStir in the molasses.\u003C/p\u003E\n, \u003Cp\u003EAdd the dry ingredients to the bowl and stir until well combined.\u003C/p\u003E\n, \u003Cp\u003EUse a spoon (or a \u003Ca href=\u0022https://shop.kingarthurflour.com/items/tablespoon-cookie-scoop\u0022\u003Etablespoon cookie scoop\u003C/a\u003E) to portion 1 1/4\u0022 balls of dough.\u003C/p\u003E\n, \u003Cp\u003ERoll the dough balls in granulated or sparkling sugar to coat before placing onto the prepared baking sheets. Leave 2\u0022 between them on all sides; they\u0027ll spread as they bake.\u003C/p\u003E\n, \u003Cp\u003EBake the cookies for 12 to 15 minutes, until they\u0027re puffed and their edges are set.\u003C/p\u003E\n, \u003Cp\u003ERemove the cookies from the oven, and cool completely right on the pan.  \u003C/p\u003E\n, \u003Cp\u003EStore cookies, well wrapped, at room temperature for several days; freeze for longer storage.\u003C/p\u003E",
