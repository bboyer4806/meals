name: Deploy

# Builds the image on GitHub's runners and checks the code, running the browser
# tests against that image, then pushes the same image to GHCR and has Dokku on
# the server run it, so what deploys is what was tested (MEA-105). The Dokku
# app, its domain and its HTTPS certificate are set up here too. The server
# limits which Dokku commands the deploy key may run, so the app's storage,
# settings and ports are set once on the server instead (README, "One-time
# server setup"). Only main deploys: pull requests, and runs started by hand on
# another branch, only run the checks.
#
# Each action is pinned to a full commit SHA, with its version in a comment, so
# moving a tag can't change the code that runs here. Dependabot proposes new
# versions as pull requests (.github/dependabot.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, in push order. A running deploy is never cancelled; a newer push
# replaces one still waiting to start, so the latest commit is what goes live. Pull requests
# and runs started by hand on another branch only run the checks, so each gets its own group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy' || github.run_id }}
  cancel-in-progress: false

env:
  APP: meals
  DOMAIN: meals.dev.boyersoftware.com

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      # No dependency needs its install script (see the Dockerfile).
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built once, into a file: the browser tests run against it, and on main
      # the push job pushes this same image.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # /healthz answers with it, so the tests and the deploy can check it's the version
          # answering.
          build-args: COMMIT=${{ github.sha }}
          # Tagged by commit so a rollback is naming an older tag, not a rebuild. Past a migration,
          # a rollback first restores the copy made before it (README, "Rolling back").
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: docker load --input "$RUNNER_TEMP/image.tar"
      - run: npx playwright install --with-deps chromium
      # Against the image, run as production runs it (playwright.config.ts).
      - run: npm run test:e2e
        env:
          E2E_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          COMMIT: ${{ github.sha }}

      - name: Keep the image for the push job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          # Its layers are already compressed.
          compression-level: 0
          # A re-run replaces the image an earlier attempt kept.
          overwrite: true

  # Pushes the image the check job tested. Kept apart from it, with no checkout
  # and nothing from the repository run, so no dependency's code ever shares a
  # runner with this job's token, which can write packages.
  push:
    needs: check
    # Deploy needs this job, so only main deploys. A pull request runs on its
    # merge ref, refs/pull/<number>/merge, so it stops after the checks too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  # Kept apart from push and given no actions, so no action's code ever shares
  # a runner with the deploy key: a job's runner only gets the secrets it uses.
  deploy:
    needs: push
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy to Dokku
        env:
          SSH_KEY: ${{ secrets.DOKKU_SSH_KEY }}
          HOST: ${{ secrets.DOKKU_HOST }}
          KNOWN_HOSTS: ${{ secrets.DOKKU_KNOWN_HOSTS }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Add the DOKKU_SSH_KEY secret under Settings > Secrets and variables > Actions}"
          : "${HOST:?Add the DOKKU_HOST secret under Settings > Secrets and variables > Actions}"
          : "${KNOWN_HOSTS:?Add the DOKKU_KNOWN_HOSTS secret under Settings > Secrets and variables > Actions}"
          mkdir -p ~/.ssh
          # Delete the key when this step ends, even if it fails, so no later
          # step can read it.
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust only the host key saved from the server itself (README,
          # "Deploying"). Scanning would trust whoever answers at $HOST.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          # Dokku runs exactly one command per SSH call. The server limits
          # which commands this key may run (the projects-key-scope plugin in
          # bboyer4806/dev); these are the ones the placeholder deploy ran.
          # StrictHostKeyChecking=yes refuses any host key but the saved one,
          # whatever the runner's own SSH settings say.
          dokku() { ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "dokku@$HOST" "$@"; }

          dokku apps:exists "$APP" || dokku apps:create "$APP"
          dokku domains:set "$APP" "$DOMAIN"

          # Re-running a workflow deploys the same image again, which Dokku
          # reports as "No changes detected" with a non-zero exit. Nothing
          # failed, and the certificate step below still needs to run.
          dokku git:from-image "$APP" "$IMAGE" 2>&1 | tee deploy.log \
            || grep -q "No changes detected" deploy.log
          # Dokku also says this when a deploy of this image was interrupted,
          # and this key can't rebuild, so say what to do.
          if grep -q "No changes detected" deploy.log; then
            echo "::warning::Dokku already had this image, so nothing was redeployed. If the site isn't running it, run 'dokku ps:rebuild $APP' on the server."
          fi

          # Needs the DNS record in place. Checked first so a deploy never
          # requests a certificate the app already has.
          if [ "$(dokku letsencrypt:active "$APP")" != "true" ]; then
            dokku letsencrypt:enable "$APP"
          fi

          # The site must answer over HTTPS, with the commit this run deployed
          # (/healthz answers with the one its image was built from). A missing
          # port map or a broken proxy can leave a deploy that otherwise looks
          # fine, and so can one that left the old version running.
          answer=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$DOMAIN/healthz")
          if [ "$answer" != "$GITHUB_SHA" ]; then
            echo "::error::https://$DOMAIN/healthz answered with commit $answer, not $GITHUB_SHA."
            exit 1
          fi
